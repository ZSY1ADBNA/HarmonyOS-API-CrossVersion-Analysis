<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>成员聊天组件隔离联调</title><style>
:root {
  --bg: #0a0a1a;
  --card-bg: rgba(255,255,255,0.04);
  --border: rgba(255,255,255,0.08);
  --text: #c8ccd8;
  --text-dim: #6b7080;
  --accent: #00d4ff;
  --accent2: #7b2ff7;
  --gradient: linear-gradient(135deg, #00d4ff, #7b2ff7);
  --radius: 14px;
}
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  line-height: 1.6;
  overflow-x: hidden;
}
body::before {
  content: ''; position: fixed; top:0; left:0; width:100%; height:100%;
  background: radial-gradient(ellipse at 20% 20%, rgba(0,212,255,0.06) 0%, transparent 50%),
              radial-gradient(ellipse at 80% 60%, rgba(123,47,247,0.06) 0%, transparent 50%);
  pointer-events: none; z-index: 0;
}

/* ── Nav ── */
nav {
  position: fixed; top:0; left:0; right:0; z-index: 100;
  background: rgba(10,10,26,0.85); backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 0 24px; height: 56px;
}
nav .logo { font-size: 18px; font-weight: 700; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-right: 24px; }
nav a {
  color: var(--text-dim); text-decoration: none; font-size: 13px; padding: 6px 14px;
  border-radius: 20px; transition: all .3s;
}
nav a:hover, nav a.active { color: #fff; background: rgba(255,255,255,0.08); }

/* ── Layout ── */
main { position: relative; z-index: 1; max-width: 1300px; margin: 0 auto; padding: 80px 24px 60px; }
section { margin-bottom: 48px; }

/* ── Section Titles ── */
.section-title {
  font-size: 22px; font-weight: 700; margin-bottom: 24px;
  background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  display: inline-block;
}

/* ── Glass Card ── */
.card {
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 28px;
  backdrop-filter: blur(8px); transition: all .35s;
}
.card:hover { transform: translateY(-3px); box-shadow: 0 8px 40px rgba(0,212,255,0.08); }

/* ── Stat Cards Row ── */
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.stat-card { text-align: center; padding: 28px 16px; }
.stat-card .version { font-size: 13px; color: var(--text-dim); margin-bottom: 6px; letter-spacing: 1px; }
.stat-card .number { font-size: 42px; font-weight: 800; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.stat-card .label  { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
.stat-card .sub    { font-size: 11px; color: var(--text-dim); margin-top: 2px; opacity: 0.7; }

/* ── Compare ── */
.compare-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
.compare-bar select {
  background: rgba(255,255,255,0.06); color: #fff; border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 16px; font-size: 14px; outline: none; cursor: pointer;
}
.compare-bar select:focus { border-color: var(--accent); }
.compare-bar .arrow { color: var(--accent); font-size: 20px; }
.compare-bar button {
  background: var(--gradient); color: #fff; border: none; border-radius: 8px;
  padding: 10px 24px; font-size: 14px; font-weight: 600; cursor: pointer;
  transition: all .3s;
}
.compare-bar button:hover { opacity: 0.85; transform: scale(1.03); }
.compare-result { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 768px) { .compare-result { grid-template-columns: 1fr; } }
.compare-box { padding: 20px; }
.compare-box.added  { border-left: 3px solid #00d4ff; }
.compare-box.removed { border-left: 3px solid #ff4d6a; }
.compare-box h3 { font-size: 16px; margin-bottom: 12px; }
.compare-box.added  h3 { color: #00d4ff; }
.compare-box.removed h3 { color: #ff4d6a; }

/* ── Table ── */
.api-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 12px; }
.api-table th { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); color: var(--text-dim); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
.api-table td { padding: 8px 12px; border-bottom: 1px solid rgba(255,255,255,0.04); }
.api-table tr:hover td { background: rgba(255,255,255,0.02); }
.api-table .badge {
  display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 600; letter-spacing: 0.5px;
}
.badge-class     { background: rgba(0,212,255,0.15); color: #00d4ff; }
.badge-interface { background: rgba(123,47,247,0.15); color: #b388ff; }
.badge-enum      { background: rgba(255,193,7,0.15); color: #ffc107; }
.badge-method    { background: rgba(76,175,80,0.15); color: #4caf50; }
.badge-property  { background: rgba(255,152,0,0.15); color: #ff9800; }

/* ── Chart container ── */
.chart-box { width: 100%; height: 420px; }

/* ── Graph section ── */
.graph-controls { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
.graph-controls select { background: rgba(255,255,255,0.06); color: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; font-size: 13px; outline: none; }
.graph-container { width: 100%; height: 520px; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); background: rgba(0,0,0,0.25); }

/* ── Loading ── */
.loading { display: flex; align-items: center; justify-content: center; height: 200px; }
.spinner { width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Scroll reveal ── */
.reveal { opacity: 0; transform: translateY(30px); transition: all .6s ease; }
.reveal.visible { opacity: 1; transform: translateY(0); }

/* ── Module tabs ── */
.module-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.module-tabs button {
  background: rgba(255,255,255,0.04); color: var(--text-dim); border: 1px solid var(--border);
  border-radius: 20px; padding: 6px 16px; font-size: 12px; cursor: pointer; transition: all .3s;
}
.module-tabs button.active, .module-tabs button:hover { background: rgba(0,212,255,0.12); color: var(--accent); border-color: rgba(0,212,255,0.3); }

/* ── Footer ── */
footer { text-align: center; padding: 20px; color: var(--text-dim); font-size: 12px; border-top: 1px solid var(--border); margin-top: 40px; }

/* ── Chat FAB ── */
.chat-fab {
  position: fixed; bottom: 28px; right: 28px; z-index: 200;
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--gradient); border: none; color: #fff;
  font-size: 22px; cursor: pointer;
  box-shadow: 0 4px 24px rgba(0,212,255,0.3);
  transition: all .35s; display: flex; align-items: center; justify-content: center;
}
.chat-fab:hover { transform: scale(1.08); box-shadow: 0 6px 36px rgba(0,212,255,0.45); }
.chat-fab .badge {
  position: absolute; top: -6px; right: -6px;
  background: #ff4d6a; color: #fff; font-size: 10px; min-width: 18px;
  height: 18px; border-radius: 9px; display: flex; align-items: center; justify-content: center;
}

/* ── Chat Panel ── */
.chat-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 210;
  opacity: 0; pointer-events: none; transition: opacity .3s;
}
.chat-overlay.open { opacity: 1; pointer-events: auto; }
.chat-panel {
  position: fixed; top: 0; right: 0; bottom: 0; width: 440px; max-width: 100vw;
  z-index: 211; background: #0f0f25; border-left: 1px solid var(--border);
  display: flex; flex-direction: column;
  transform: translateX(100%); transition: transform .35s ease;
}
.chat-panel.open { transform: translateX(0); }
.chat-panel-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px; border-bottom: 1px solid var(--border);
  background: rgba(10,10,26,0.95);
}
.chat-panel-header h3 { font-size: 16px; color: #fff; }
.chat-panel-header .close-btn {
  background: none; border: none; color: var(--text-dim); font-size: 22px; cursor: pointer;
  transition: color .2s;
}
.chat-panel-header .close-btn:hover { color: #fff; }
.chat-body {
  flex: 1; overflow-y: auto; padding: 16px;
  display: flex; flex-direction: column; gap: 12px;
}
.chat-body .suggestions {
  display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px;
}
.chat-body .suggestions button {
  background: rgba(0,212,255,0.08); color: var(--accent); border: 1px solid rgba(0,212,255,0.15);
  border-radius: 16px; padding: 6px 14px; font-size: 12px; cursor: pointer;
  transition: all .2s;
}
.chat-body .suggestions button:hover { background: rgba(0,212,255,0.15); }
.chat-msg {
  max-width: 90%; padding: 12px 16px; border-radius: 14px;
  font-size: 13px; line-height: 1.65; word-break: break-word;
}
.chat-msg.user {
  align-self: flex-end; background: rgba(0,212,255,0.12);
  border: 1px solid rgba(0,212,255,0.2);
}
.chat-msg.assistant {
  align-self: flex-start; background: rgba(255,255,255,0.04);
  border: 1px solid var(--border); border-left: 3px solid var(--accent2);
}
.chat-msg .label { font-size: 10px; color: var(--text-dim); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }
.chat-msg code {
  background: rgba(0,0,0,0.3); padding: 1px 6px; border-radius: 4px;
  font-size: 11px; color: #ffc107;
}
.chat-msg .cypher-block {
  margin-top: 8px; background: rgba(0,0,0,0.3); border-radius: 8px; padding: 10px;
  font-family: 'Consolas', 'Courier New', monospace; font-size: 11px;
  color: #aaa; max-height: 120px; overflow-y: auto; cursor: pointer;
  white-space: pre-wrap; display: none;
}
.chat-msg .cypher-block.show { display: block; }
.chat-msg .toggle-cypher {
  font-size: 10px; color: var(--accent); cursor: pointer; margin-top: 4px;
  display: inline-block;
}
.chat-msg .result-table {
  margin-top: 8px; width: 100%; border-collapse: collapse; font-size: 11px;
}
.chat-msg .result-table th { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--border); color: var(--text-dim); }
.chat-msg .result-table td { padding: 3px 8px; border-bottom: 1px solid rgba(255,255,255,0.04); }
.chat-msg .result-summary {
  font-size: 11px; color: var(--text-dim); margin-top: 6px;
}
.chat-input-bar {
  display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border);
  background: rgba(10,10,26,0.95);
}
.chat-input-bar textarea {
  flex: 1; background: rgba(255,255,255,0.04); border: 1px solid var(--border);
  border-radius: 10px; color: #fff; padding: 10px 14px; font-size: 13px;
  resize: none; outline: none; font-family: inherit; rows: 2;
}
.chat-input-bar textarea:focus { border-color: var(--accent); }
.chat-input-bar button {
  background: var(--gradient); border: none; border-radius: 10px;
  color: #fff; padding: 10px 18px; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: opacity .2s;
}
.chat-input-bar button:disabled { opacity: 0.4; cursor: not-allowed; }
.chat-input-bar button:hover:not(:disabled) { opacity: 0.85; }

/* ── Agent step trace ── */
.agent-steps { margin: 8px 0; }
.agent-step {
  margin: 6px 0; padding: 8px 10px; font-size: 11px;
  background: rgba(0,0,0,0.25); border-left: 2px solid var(--accent);
  border-radius: 6px;
}
.agent-step.error { border-left-color: #ff4d6a; }
.agent-step-head { color: var(--text); font-weight: 600; }
.agent-step-args {
  color: var(--text-dim); font-family: 'Consolas','Courier New',monospace;
  font-size: 10px; word-break: break-all; margin: 4px 0;
}
.agent-step-error { color: #ff4d6a; margin-top: 4px; }

/* ── Typing dots ── */
.typing-dots { display: flex; gap: 4px; padding: 4px 0; }
.typing-dots span {
  width: 7px; height: 7px; border-radius: 50%; background: var(--text-dim);
  animation: bounce 1.2s infinite;
}
.typing-dots span:nth-child(2) { animation-delay: .15s; }
.typing-dots span:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 0%,60%,100% { opacity: 0.3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-8px); } }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
body{padding:24px}#chatPanel{position:relative;right:auto;bottom:auto;width:min(960px,96vw);height:72vh;display:flex;transform:none;opacity:1;margin:20px auto}#chatFab,#chatOverlay,.close-btn{display:none!important}.integration-head{max-width:960px;margin:auto}.evidence-envelope{border:1px solid #40556e;padding:10px;margin:8px 0}.evidence-envelope a{color:#8ecbff}select{padding:8px;font:inherit;color:#182437}</style><body><div class="integration-head"><h1>OpenHarmony API 查询助手</h1><p>成员聊天组件的本地隔离联调；图谱面板与正式部署未接入，不能代表成员验收。</p><label>来源发行 <select id="sourceRelease"><option>4.1</option><option>5.0.3</option><option>5.1.0</option><option>6.0</option><option selected>6.1</option></select></label><p>点击发送后，将本次问题、同发行的本页对话及官方证据交给已配置的 DeepSeek 生成回答。</p><p id="integrationStatus" role="status">已连接同版只读证据工具。来源发行不等于工程SDK。</p></div><button class="chat-fab" id="chatFab" onclick="openChat()" title="AI 助手">
  💬
  <span class="badge" id="chatBadge" style="display:none">!</span>
</button>

<div class="chat-overlay" id="chatOverlay" onclick="closeChat()"></div>
<div class="chat-panel" id="chatPanel">
  <div class="chat-panel-header">
    <h3>🤖 AI 分析助手</h3>
    <div style="display:flex;gap:8px;align-items:center">
      <button onclick="clearChat()" style="background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:11px" title="清空对话">清空</button>
      <button class="close-btn" onclick="closeChat()">✕</button>
    </div>
  </div>
  <div class="chat-body" id="chatBody">
    <div class="chat-msg assistant">
      <div class="label">🤖 AI 助手</div>
      <div>请选择来源发行，再查询API；回答将基于本轮工具证据。</div>
    </div>
    <div class="suggestions">
      <button onclick="askSuggestion(this)">请查询当前发行createHttp的返回类型并给出固定官方出处。</button>
      <button onclick="askSuggestion(this)">请查询当前发行HttpRequestOptions的连接超时与读取超时说明，给出官方出处。</button>
      <button onclick="askSuggestion(this)">请查询当前发行ohos.test.__NonexistentApiForEvaluation__，无匹配时说明覆盖边界。</button>
      <button onclick="askSuggestion(this)">请说明当前发行createHttp还有哪些SDK适用条件未验证，并给出依据。</button>
    </div>
  </div>
  <div class="chat-input-bar">
    <textarea id="chatInput" rows="2" maxlength="3000" placeholder="例如：createHttp返回什么类型？请给出当前发行出处"
              onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea>
    <button id="sendBtn" onclick="sendMessage()">发送</button>
  </div>
</div>

<script>
const releaseSelect=document.querySelector('#sourceRelease');let historyRelease=releaseSelect.value,integrationEpoch=0,integrationController;
function resetEvidenceChat(){integrationEpoch++;if(integrationController)integrationController.abort();historyRelease=releaseSelect.value;clearChat();document.querySelector('#sendBtn').disabled=false;document.querySelector('#integrationStatus').textContent='来源发行已切换，旧回答与历史已清除。';}
releaseSelect.addEventListener('change',resetEvidenceChat);
function renderEvidenceEnvelope(data){
 const box=document.createElement('div');box.className='evidence-envelope';
 const add=(s)=>{const p=document.createElement('p');p.textContent=s;box.append(p);};
 const labels={model_answer_with_tool_results:'已根据本轮证据回答',no_matching_evidence:'当前覆盖范围无匹配',no_verified_tool_result:'本轮未取得可验证证据',model_timeout:'模型回答超时',model_unavailable:'模型未完成本轮回答',invalid_model_response:'模型响应格式异常',query_incomplete:'本轮查询尚未形成回答',evidence_requires_narrower_query:'请缩小查询范围'};
 add('来源发行：'+data.source_release+'；'+(labels[data.status]||'请核对本轮状态'));
 add('正式API身份、SDK公开范围及目标编译条件仍需核对。');
 if(!data.answer)add(data.note||'本轮没有可验证的回答，请核对版本、证据或缩小查询后重试。');
 if(!data.answer)add('这条失败问题不会带入下一轮；如需继续，请重新发送。');
 for(const evidence of data.evidence||[])if(evidence.ok===false&&evidence.error)add('工具反馈：'+evidence.error);
 const urls=new Set();function scan(x){if(!x||typeof x!=='object')return;for(const [k,v] of Object.entries(x)){if(k==='source_url'&&typeof v==='string'){try{const u=new URL(v);if(u.protocol==='https:'&&u.hostname==='github.com'&&u.pathname.startsWith('/openharmony/'))urls.add(u.href);}catch{}}else if(typeof v==='object')scan(v);}}
 scan(data.evidence);let count=0;for(const url of [...urls].slice(0,12)){const a=document.createElement('a');const path=new URL(url).pathname;a.textContent=String(++count)+'. '+decodeURIComponent(path.split('/').pop());a.href=url;a.target='_blank';a.rel='noopener noreferrer';box.append(a,document.createElement('br'));}
 if(!urls.size)add('没有可直接打开的官方出处；不能据此生成API事实。');
 return box.outerHTML;
}
let chatHistory = [];
let isChatOpen = true;

function openChat() {
  document.getElementById('chatPanel').classList.add('open');
  document.getElementById('chatOverlay').classList.add('open');
  document.getElementById('chatFab').style.display = 'none';
  isChatOpen = true;
  document.getElementById('chatBadge').style.display = 'none';
  setTimeout(() => document.getElementById('chatInput').focus(), 400);
}

function closeChat() {
  document.getElementById('chatPanel').classList.remove('open');
  document.getElementById('chatOverlay').classList.remove('open');
  document.getElementById('chatFab').style.display = 'flex';
  isChatOpen = false;
}

function clearChat() {
  integrationEpoch++; if(integrationController)integrationController.abort(); historyRelease=releaseSelect.value; document.querySelector("#sendBtn").disabled=false;
  chatHistory = [];
  const body = document.getElementById('chatBody');
  body.innerHTML = `
    <div class="chat-msg assistant">
      <div class="label">🤖 AI 助手</div>
      <div>对话已清空。有什么想了解的吗？</div>
    </div>
    <div class="suggestions">
      <button onclick="askSuggestion(this)">请查询当前发行createHttp的返回类型并给出固定官方出处。</button>
      <button onclick="askSuggestion(this)">请查询当前发行HttpRequestOptions的连接超时与读取超时说明，给出官方出处。</button>
      <button onclick="askSuggestion(this)">请查询当前发行ohos.test.__NonexistentApiForEvaluation__，无匹配时说明覆盖边界。</button>
      <button onclick="askSuggestion(this)">请说明当前发行createHttp还有哪些SDK适用条件未验证，并给出依据。</button>
    </div>`;
}

function askSuggestion(btn) {
  document.getElementById('chatInput').value = btn.textContent;
  sendMessage();
}

async function sendMessage() {
  const requestEpoch = integrationEpoch;
  const input = document.getElementById('chatInput');
  const msg = input.value.trim();
  if (!msg) return;

  const body = document.getElementById('chatBody');
  const sendBtn = document.getElementById('sendBtn');

  // Remove suggestions
  const suggs = body.querySelector('.suggestions');
  if (suggs) suggs.remove();

  // Add user message
  body.innerHTML += `<div class="chat-msg user"><div class="label">👤 你</div>${escapeHtml(msg)}</div>`;

  // Typing indicator
  const typingId = 'typing-' + Date.now();
  body.innerHTML += `<div class="chat-msg assistant" id="${typingId}"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
  body.scrollTop = body.scrollHeight;

  input.value = '';
  input.style.height = 'auto';
  sendBtn.disabled = true;

  // Add to history
  // Commit only a completed answer pair after this request succeeds.

  try {
    // Agent 多轮推理可能 30–90s，150s 超时防 typing 无限转圈
    const ctrl = new AbortController(); integrationController = ctrl;
    const timer = setTimeout(() => ctrl.abort(), 150000);
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({message:msg, version:releaseSelect.value, history:chatHistory.slice(-8), history_version:historyRelease}),
      signal: ctrl.signal
    });
    clearTimeout(timer);
    const data = await resp.json();
    if(requestEpoch !== integrationEpoch) return;
    if(!resp.ok) throw Error(data.error?.message || "本轮请求未完成");

    // Remove typing
    document.getElementById(typingId)?.remove();

    // Build assistant response
    let html = `<div class="chat-msg assistant"><div class="label">🤖 AI 助手</div>`;

    html += renderEvidenceEnvelope(data);
    // Agent 推理轨迹（新增）
    if (data.steps && data.steps.length) {
      html += `<details><summary>查看取证过程</summary><div class="agent-steps">` + data.steps.map(renderStep).join('') + `</div></details>`;
    }

    if (data.answer) {
      html += `<div>${formatAnswer(data.answer)}</div>`;
    }

    // 旧单发模式渲染（无轨迹时兜底）
    if (!data.steps || !data.steps.length) {
      // Cypher block
      if (data.cypher) {
        const cypherId = 'cypher-' + Date.now();
        html += `<span class="toggle-cypher" onclick="document.getElementById('${cypherId}').classList.toggle('show');this.textContent=this.textContent.includes('查看')?'收起查询':'查看Cypher查询'">查看Cypher查询</span>`;
        html += `<div class="cypher-block" id="${cypherId}">${escapeHtml(data.cypher)}</div>`;
      }
      // Results table (if any)
      if (data.results && Array.isArray(data.results) && data.results.length > 0) {
        html += renderResultTable(data.results);
      } else if (data.results && data.results._error) {
        html += `<div style="font-size:11px;color:#ff4d6a;margin-top:4px">查询错误: ${escapeHtml(data.results._error)}</div>`;
      }
    }

    html += `</div>`;
    body.innerHTML += html;

    if(['model_answer_with_tool_results','no_matching_evidence'].includes(data.status) && data.answer?.trim()) {
      chatHistory.push({role:'user',content:msg},{role:'assistant',content:data.answer});
      chatHistory=chatHistory.slice(-8);
    }

  } catch (e) {
    if(requestEpoch !== integrationEpoch) return;
    document.getElementById(typingId)?.remove();
    const errMsg = e.name === 'AbortError' ? '请求超时（Agent 推理超过 150 秒），请稍后重试' : e.message;
    body.innerHTML += `<div class="chat-msg assistant"><div class="label">🤖 AI 助手</div>❌ 请求失败：${escapeHtml(errMsg)}</div>`;
  }

  body.scrollTop = body.scrollHeight;
  sendBtn.disabled = false;

  // Flash badge if chat is closed
  if (!isChatOpen) {
    document.getElementById('chatBadge').style.display = 'flex';
    setTimeout(() => { document.getElementById('chatBadge').style.display = 'none'; }, 5000);
  }
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = String(s);
  return div.innerHTML;
}

function formatAnswer(text) {
  // Simple markdown-like formatting
  let html = escapeHtml(text);
  html = html.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre style="background:rgba(0,0,0,0.3);padding:8px;border-radius:6px;font-size:11px;overflow-x:auto">$2</pre>');
  html = html.replace(/`(.+?)`/g, '<code>$1</code>');
  html = html.replace(/\n• /g, '\n<br/>• ');
  html = html.replace(/\n- /g, '\n<br/>- ');
  html = html.replace(/\n(\d+)\. /g, '\n<br/>$1. ');
  return html;
}

// ── Agent 轨迹渲染 ──

function renderResultTable(rows, maxRows = 10) {
  if (!rows || !Array.isArray(rows) || rows.length === 0) return '';
  const keys = Object.keys(rows[0]).filter(k => !k.startsWith('_'));
  let html = `<div class="result-summary">📋 查询结果 (${rows.length} 条)</div>`;
  html += `<table class="result-table"><thead><tr>${keys.map(k => `<th>${k}</th>`).join('')}</tr></thead><tbody>`;
  rows.slice(0, maxRows).forEach(row => {
    html += `<tr>${keys.map(k => `<td>${escapeHtml(String(row[k]||'').slice(0,60))}</td>`).join('')}</tr>`;
  });
  if (rows.length > maxRows) html += `<tr><td colspan="${keys.length}" style="color:var(--text-dim);text-align:center">... 还有 ${rows.length - maxRows} 条</td></tr>`;
  html += `</tbody></table>`;
  return html;
}

function renderStep(step, idx) {
  const headIcon = step.ok ? '🔧' : '⚠️';
  const cypherId = `step-cypher-${idx}-${Date.now()}`;
  let html = `<div class="agent-step ${step.ok ? '' : 'error'}">`;
  html += `<div class="agent-step-head">${headIcon} 调用工具 <code>${escapeHtml(step.tool)}</code></div>`;
  if (step.args && Object.keys(step.args).length) {
    html += `<div class="agent-step-args">${escapeHtml(JSON.stringify(step.args))}</div>`;
  }
  if (step.cypher) {
    html += `<span class="toggle-cypher" onclick="document.getElementById('${cypherId}').classList.toggle('show');this.textContent=this.textContent.includes('查看')?'收起查询':'查看Cypher查询'">查看Cypher查询</span>`;
    html += `<div class="cypher-block" id="${cypherId}">${escapeHtml(step.cypher)}</div>`;
  }
  if (step.error) html += `<div class="agent-step-error">${escapeHtml(step.error)}</div>`;
  if (step.result_summary) html += `<div class="result-summary">${escapeHtml(step.result_summary)}</div>`;
  if (step.rows && Array.isArray(step.rows) && step.rows.length) html += renderResultTable(step.rows);
  html += `</div>`;
  return html;
}

</script></body></html>
